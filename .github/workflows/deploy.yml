name: CI/CD Pipeline - Build, Test & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # STEP 1: VALIDATE & BUILD
  # ----------------------------------------------------
  build-and-test:
    name: Build & Validate Full Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install & Validate Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app.models; import app.prompts; print('Backend modules validated successfully!')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------
  # STEP 2: AUTOMATIC DEPLOYMENT TO AWS EC2
  # ----------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting automated deployment on EC2..."
            cd ~/psychatrist || exit 1
            
            echo "📥 Pulling latest changes from main..."
            git pull origin main
            
            echo "🐳 Rebuilding and updating Docker containers..."
            sudo docker compose up -d --build
            
            echo "🔍 Verifying running containers..."
            sudo docker compose ps
            
            echo "✅ Deployment successful! App is live at: http://$(curl -s ifconfig.me)"
